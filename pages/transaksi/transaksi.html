<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NataFin - Tambah Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-natafin">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">NataFin</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNataFin" aria-controls="navbarNataFin"
                aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNataFin">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="transaksi.html">Tambah Transaksi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../keuangan/detail.html">Detail Keuangan</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section class="card content-card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <p class="eyebrow">PENCATATAN KEUANGAN</p>

                <h1 class="section-title">Tambah Transaksi</h1>

                <p class="text-secondary mb-4">
                    Masukkan informasi pemasukan atau pengeluaran yang ingin dicatat.
                </p>

                <form action="#" method="get">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="jenis" class="form-label">Jenis Transaksi</label>

                            <select id="jenis" name="jenis" class="form-select" required>
                                <option value="pemasukan">Pemasukan</option>
                                <option value="pengeluaran">Pengeluaran</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="kategori" class="form-label">Kategori</label>

                            <select id="kategori" name="kategori" class="form-select" required>
                                <option value="makanan">Makanan</option>
                                <option value="transportasi">Transportasi</option>
                                <option value="pendidikan">Pendidikan</option>
                                <option value="hiburan">Hiburan</option>
                                <option value="belanja">Belanja</option>
                                <option value="tagihan">Tagihan</option>
                                <option value="lainnya">Lainnya</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="nominal" class="form-label">Nominal (Rp)</label>

                            <input type="number" id="nominal" name="nominal"
                                class="form-control" min="1"
                                placeholder="Contoh: 25000" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="tanggal" class="form-label">Tanggal Transaksi</label>

                            <input type="date" id="tanggal" name="tanggal"
                                class="form-control" required>
                        </div>

                        <div class="col-12">
                            <label for="keterangan" class="form-label">Keterangan</label>

                            <textarea id="keterangan" name="keterangan"
                                class="form-control" rows="4"
                                placeholder="Masukkan keterangan transaksi" required></textarea>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-gold">Simpan Transaksi</button>
                            <a href="../../index.html" class="btn btn-outline-navy ms-1">Batal</a>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer-natafin">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 NataFin</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
